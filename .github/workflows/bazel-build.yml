name: "Bazel Build and Test"

on:
  pull_request:
    branches: [ master ]
    paths:
      - 'src/**'
      - 'include/**'
      - 'test/**'
      - 'BUILD.bazel'
      - 'MODULE.bazel'
      - 'WORKSPACE.bazel'
      - 'bazel/**'
      - '.bazelrc'
      - '.bazelversion'
      - 'build.sh'
      - '.github/workflows/bazel-build.yml'
  push:
    branches: [ master ]

permissions:
  pull-requests: write

concurrency:
  group: bazel-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # C++ Bazel Build and Test via ./build.sh (same entrypoint as other AppLovin C++ libs)
  bazel-cpp:
    runs-on: ubuntu-latest
    name: "Bazel C++ Build & Test"
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.8.5
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
          bazelrc: |
            build --config=ci
            test --config=ci

      - name: Build C++ Library and CLI
        run: |
          chmod +x ./build.sh
          ./build.sh -B

      - name: Run C++ Tests
        run: |
          ./build.sh -B -t
          
      - name: Test Results Summary
        if: always()
        run: |
          echo "## Bazel C++ Build Results" >> $GITHUB_STEP_SUMMARY
          echo "C++ build and test via ./build.sh -B / -B -t" >> $GITHUB_STEP_SUMMARY

  # Summary Job
  build-summary:
    needs: [bazel-cpp]
    runs-on: ubuntu-latest
    if: always()
    name: "Build Summary"
    
    steps:
      - name: Build Summary
        run: |
          echo "## AxonCache C++ Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY  
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| C++ Bazel (Ubuntu) | ${{ needs.bazel-cpp.result == 'success' && 'Passed' || 'Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "CI entrypoint: ./build.sh -B / ./build.sh -B -t (clang-tidy out of scope for this lib)." >> $GITHUB_STEP_SUMMARY
