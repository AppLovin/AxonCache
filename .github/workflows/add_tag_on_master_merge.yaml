# .github/workflows/tag-on-master.yml
name: Tag on merge to master

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need full history + tags

      - name: Get next patch tag
        id: vars
        run: |
          # Get the latest tag matching v<number>.<number>.<number>
          latest=$(git tag --list "v[0-9]*.[0-9]*.[0-9]*" | sort -V | tail -n1)

          # Default if no tag exists
          if [ -z "$latest" ]; then
            latest="v0.0.0"
          fi
          echo "Latest tag: $latest"

          # Strip leading v
          version=${latest#v}

          # Extract major, minor, patch
          IFS='.' read -r major minor patch <<< "$version"

          # Increment patch version
          next_patch=$((patch + 1))

          # Generate new tag
          new="v${major}.${minor}.${next_patch}"
          echo "New tag: $new"

          echo "tag=$new" >> $GITHUB_OUTPUT

      - name: Create and push tag
        run: |
          git tag ${{ steps.vars.outputs.tag }}
          git push origin ${{ steps.vars.outputs.tag }}

      - name: Create GitHub Release and upload source assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          set -euo pipefail

          ARCHIVE="AxonCache-${TAG}.tar.gz"
          git archive --format=tar.gz --prefix="AxonCache-${TAG}/" --output="$ARCHIVE" "$TAG"
          SHA256=$(sha256sum "$ARCHIVE" | awk '{print $1}')
          echo "$SHA256  $ARCHIVE" > "${ARCHIVE}.sha256"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release for ${TAG} already exists"
          else
            gh release create "$TAG" \
              --title "Release ${TAG}" \
              --notes "Source archive SHA256: ${SHA256}"
          fi

          existing_assets=$(gh release view "$TAG" --json assets -q '.assets[].name')

          if echo "$existing_assets" | grep -qx "$ARCHIVE"; then
            echo "Asset ${ARCHIVE} already uploaded, skipping"
          else
            gh release upload "$TAG" "$ARCHIVE"
          fi

          if echo "$existing_assets" | grep -qx "${ARCHIVE}.sha256"; then
            echo "Asset ${ARCHIVE}.sha256 already uploaded, skipping"
          else
            gh release upload "$TAG" "${ARCHIVE}.sha256"
          fi
