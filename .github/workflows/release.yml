name: Release AxonCache Java

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  build-natives:
    strategy:
      matrix:
        include:
          - os: macos-14
            platform: osx-aarch64
            cmake-arch: arm64
          - os: ubuntu-22.04
            platform: linux-x86_64
            cmake-arch: x86_64
            container: "ubuntu:20.04"
          - os: ubuntu-22.04
            platform: linux-aarch64
            cmake-arch: aarch64
            container: "ubuntu:20.04"

    runs-on: ${{ matrix.os }}
    # Linux libs are built inside an Ubuntu 20.04 (glibc 2.31) container instead of directly on
    # the ubuntu-22.04 host (glibc 2.35) - some consumers run on agents/containers with an older
    # glibc than that, and a lib built against a newer glibc can't be loaded there at all
    # (UnsatisfiedLinkError: version `GLIBC_2.33' not found). Building against an older glibc
    # keeps the result loadable on anything newer, so target the oldest floor you actually need
    # to support, not whatever happens to be on the build host.
    container: ${{ matrix.container }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        env:
          # A bare ubuntu:20.04 container has no pre-seeded timezone, unlike the GH-hosted runner
          # images. Without this, installing a JDK pulls in tzdata as a transitive dependency and
          # apt hangs forever on an interactive timezone prompt (no TTY in CI to answer it).
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          # A JDK is only needed here to compile the JNI glue and generate native headers - it's
          # unrelated to the target bytecode version of the published jar, which is built
          # separately in the package-jar job. The GH-hosted runner's pre-installed JDKs aren't
          # visible inside this container, so one has to be installed explicitly. Must be the
          # full JDK, not -headless: CMake's FindJNI requires libjawt.so (AWT), which headless
          # builds deliberately omit.
          apt-get install -y git ca-certificates curl python3-pip ninja-build openjdk-11-jdk
          # Ubuntu 20.04's packaged cmake (3.16) is older than this project requires (>=3.24);
          # get a current one from PyPI instead of building it from source.
          pip3 install --upgrade "cmake>=3.24"

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.platform == 'linux-aarch64'
        run: |
          apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
      
      - name: Build native library
        run: |
          mkdir -p build
          cd build
          
          if [ "${{ matrix.platform }}" = "linux-aarch64" ]; then
            cmake .. -GNinja \
              -DCMAKE_BUILD_TYPE=Release \
              -DAL_WITH_JAVA=ON \
              -DCMAKE_SYSTEM_NAME=Linux \
              -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
              -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
              -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++
          else
            cmake .. -GNinja \
              -DCMAKE_BUILD_TYPE=Release \
              -DAL_WITH_JAVA=ON
          fi
          
          cmake --build . --target axoncache_jni
      
      - name: Prepare artifact
        run: |
          mkdir -p artifacts/${{ matrix.platform }}
          if [ "${{ runner.os }}" = "macOS" ]; then
            cp build/java/libaxoncache_jni.dylib artifacts/${{ matrix.platform }}/
          else
            cp build/java/libaxoncache_jni.so artifacts/${{ matrix.platform }}/
          fi
      
      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: artifacts/${{ matrix.platform }}/*

  package-jar:
    needs: build-natives
    runs-on: ubuntu-22.04
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Download all native libraries
        uses: actions/download-artifact@v4
        with:
          path: natives-download
      
      - name: Organize native libraries
        run: |
          mkdir -p java/src/main/resources/natives/osx-aarch64
          mkdir -p java/src/main/resources/natives/linux-x86_64
          mkdir -p java/src/main/resources/natives/linux-aarch64
          
          cp natives-download/native-osx-aarch64/* java/src/main/resources/natives/osx-aarch64/
          cp natives-download/native-linux-x86_64/* java/src/main/resources/natives/linux-x86_64/
          cp natives-download/native-linux-aarch64/* java/src/main/resources/natives/linux-aarch64/
      
      - name: Build JAR with Maven
        run: |
          # Derive the artifact version from the release tag (e.g. v1.0.9 -> 1.0.9)
          # so each tagged release produces a distinctly-versioned JAR.
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Building axoncache-java version: $VERSION"
          cd java
          mvn -B -Drevision="$VERSION" clean package
      
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: axoncache-java-jar
          path: java/target/axoncache-java-*.jar

  create-release:
    needs: package-jar
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: axoncache-java-jar
          path: release-artifacts
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release-artifacts/*.jar
          body: |
            AxonCache Java Bindings Release ${{ github.ref_name }}
            
            Supported Platforms:
            - macOS ARM64 (Apple Silicon)
            - Linux x86_64 (AMD64)
            - Linux ARM64 (aarch64)
            
            Usage:
            Add the JAR to your project classpath. Native libraries will be loaded automatically.
          draft: false
          prerelease: false

